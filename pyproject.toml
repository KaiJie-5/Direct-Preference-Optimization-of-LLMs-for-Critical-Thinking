[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dpo-critical-thinking"
version = "0.1.0"
description = "Enrichment utilities for DPO critical-thinking data preparation."
requires-python = ">=3.10"
dependencies = ["beautifulsoup4>=4.12", "openpyxl>=3.1", "striprtf==0.0.32"]

[project.optional-dependencies]
dev = ["pytest>=8"]
transformers = [
  "torch",
  "transformers>=4.45",
  "accelerate",
  "bitsandbytes",
  "optimum",
  "gptqmodel",
  "torchvision",
]
training = [
  "torch>=2.8.0",
  "transformers>=4.56.1,<6",
  "trl==1.9.0",
  "datasets>=4.1.0",
  "accelerate>=1.10.1",
]
training-ministral = [
  "torch>=2.8.0",
  "transformers>=5.14.1,<6",
  "trl==1.9.0",
  "datasets>=4.1.0",
  "accelerate>=1.10.1",
  "mistral-common>=1.8.6",
]
legacy-gptq = ["auto-gptq"]

[project.scripts]
dpo-enrich = "enrichment.cli:main"
dpo-reflective-enrich = "reflective_enrichment.cli:main"
dpo-build-preferences = "preference_pairs.cli:main"
dpo-build-domain-holdout = "preference_pairs.domain_holdout_cli:main"
dpo-train = "dpo_training.cli:main"
dpo-preprocess = "preprocessing.cli:main"
dpo-debate = "debate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = [
  "enrichment*",
  "preprocessing*",
  "debate*",
  "reflective_enrichment*",
  "preference_pairs*",
  "dpo_training*",
]
